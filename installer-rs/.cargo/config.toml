# TUI 安装器的构建目标由 scripts/build-tui-installer.mjs 通过 `--target` 指定。
# Linux 一律 musl（静态，零运行库依赖）——安装器要在任意发行版的目标机上直接运行；
# 安装器是纯 Rust（无 C 依赖），musl 交叉只需要 rustup 的 rust-lld，不需要 zig。
# 与 core-rs/.cargo/config.toml 同一手法（那边 C 部分另注入 zig）。

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
