<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>远程终端</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 终端标签条：状态点 + 标签名 + ✕，尾部「+」新建（specs/022 FR-003） -->
    <header id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" type="button" class="newtab">+</button>
    </header>
    <!-- 标签页区：每个标签一个 xterm 宿主；连接中 / 断开态以覆盖层呈现 -->
    <main id="panes"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
