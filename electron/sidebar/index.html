<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="header">
      <input class="search-input" id="searchInput" type="text" placeholder="搜索对话标题" autocomplete="off" spellcheck="false" />
      <button class="new-chat-btn" id="newChat">+ 新对话</button>
    </div>
    <div class="list" id="list"></div>
    <div class="footer" id="footer"></div>
    <!-- 文件浏览器（US-42 / US-43）：默认折叠成一条分区条，展开占侧栏 50% 高度。
         初始隐藏（.hidden），等首个工作区状态到达后由 main.ts 决定显示与否。 -->
    <div class="files-section hidden" id="filesSection">
      <div class="files-header" id="filesHeader">
        <span class="files-chevron" id="filesChevron"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        <span class="files-title">文件资源管理器</span>
        <span class="files-header-spacer"></span>
        <button class="files-refresh" id="filesRefresh" title="刷新">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
      <div class="files-body" id="filesBody">
        <div class="files-tree" id="filesTree" tabindex="0" role="tree" aria-label="工作区文件"></div>
      </div>
    </div>
    <!-- 侧栏宽度拖拽手柄（US-44）：吸附右缘，固定定位在最上层 -->
    <div class="resize-handle" id="resizeHandle" title="拖动调整侧栏宽度，双击恢复默认"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
