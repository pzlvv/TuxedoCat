<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 自绘标题栏（specs/040 FR-001）：文件名 + 「全文 / 变更」切换按钮。
         `canDiff` 为假时不渲染按钮（虚拟文档 / 非 git 工作区）。 -->
    <header id="editor-titlebar">
      <span class="doc-title"></span>
      <div class="drag-filler"></div>
      <div class="controls"></div>
    </header>
    <div id="empty-state" hidden></div>
    <div id="container"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
