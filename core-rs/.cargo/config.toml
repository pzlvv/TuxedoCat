# Standalone Core 的构建目标由 scripts/build-core.mjs 通过 `--target` 指定，
# 这里不写死默认目标：平台矩阵（Windows / Linux × x64 / arm64）里的每个组合
# 都应能直接构建。见 docs/standalone-core.md 第 4.1 节。

# Linux 产物走 musl（静态，见 scripts/build-core.mjs 的平台矩阵）。
# 链接器用 rustup 自带的 rust-lld + self-contained 的 musl crt / libc：
# 不依赖系统上的交叉链接器。C 依赖（ring 的 C / 汇编、musl 产物的 mimalloc）
# 另由构建脚本注入 CC / AR（zig）。
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
