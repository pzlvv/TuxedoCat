[package]
name = "standalone-core"
version = "0.0.1"
edition = "2021"
description = "Standalone Core (out-of-process core implementation)"
license = "Apache-2.0"
# 构建脚本把 build-core.mjs 的构建指纹烧进编译期环境（docs/standalone-core.md 第 4.4 节）
build = "build.rs"

# 包名与二进制名保持中性的 `standalone-core`：对外可执行文件名由
# `src/config/project.json` 的 `core.binaryName` 决定，构建脚本按它落位，
# 产品名不出现在 Rust 侧。
[[bin]]
name = "standalone-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：帧内字段保持写入顺序，与 TypeScript 侧声明的字段顺序一致，
# 便于人眼比对帧内容与日志。
serde_json = { version = "1", features = ["preserve_order"] }
# 阻塞式 HTTP 客户端：查询在各自线程上跑，不需要异步运行时
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
sha2 = "0.10"
# Read 工具的 xlsx/xlsm 读取（对齐 Embedded 的 `xlsx` npm 包 + `readXlsxContent`）。
calamine = "0.36"
# ECMAScript `Number.prototype.toString()` 口径的浮点格式化：xlsx 单元格
# `String(cell)` 与 Embedded 逐字一致（Rust 默认格式化在指数阈值上不同）。
ryu-js = "1"
# 控制连接的 TCP keepalive 参数（`docs/core-remote.md` 第 2.5 节）：std 的
# keepalive 参数配置尚未稳定（`tcp_keepalive` feature），用 socket2 设置。
socket2 = "0.6"
notify = "8.2.0"
# 子进程输出 / 文件内容的码页解码（`text_decode.rs`）：Windows 上 cmd.exe 与老工具按
# 控制台代码页输出（简体中文 936 = GBK），直接按 UTF-8 解会整片乱码。GBK 解码器即
# GB18030 的超集实现，GBK / GB2312 一并覆盖，因此不需要再引窄码表。
encoding_rs = "0.8"

# Linux 发布产物（musl 静态）的全局分配器换成 mimalloc，替掉 musl 自带的 mallocng
# （docs/core/standalone-core.md 第 3.3 节）。只在 musl 目标上挂：ASAN 变体走 gnu
# 三元组，必须把 malloc / free 留给 ASAN 拦截，不能换成 mimalloc。
# `override`：连 libc 的 malloc / free 符号一起交给 mimalloc，C 依赖（ring）的分配与
# Rust 侧同堆。libmimalloc-sys 的 C 源文件由 cc-rs 直接编译，不经 autoconf / make，
# 交叉编译沿用构建脚本注入的同一套 CC / AR。
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["override"] }

[dev-dependencies]
# 单测里现造最小 xlsx（zip + inline string）作为 Read xlsx 路径的夹具
zip = "8"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 崩溃诊断：**去掉调试信息段，保留符号表**。
#
# 判据是「哪部分数据真的被用到了」：daemon / Core 异常退出时，panic 钩子
# （`util::install_panic_hook`）强制捕获的调用栈要能符号化出**函数名**，靠的是
# `.symtab` / `.strtab`；`.debug_*` 那些段（DWARF 行号表与类型信息）只在用
# `addr2line` / debugger 事后解析「源码行号」时才需要，运行时完全不参与加载。
#
# 体积账（x64-linux 实测，见 `docs/core/standalone-core.md` 的「产物体积」一节）：
# 34.3MB 里 26.2MB 是 .debug_*、1.0MB 是符号表、7.1MB 是运行所需段。`strip="debuginfo"`
# 只删前者，产物降到约 8MB——这直接决定远端部署要上传多少字节（SSH 车道的冷部署
# 走 SFTP 整份上传）。
#
# 为什么不是 `strip = true`：那会连 `.symtab` 一起删，栈退化成裸地址，崩溃诊断
# 能力真正丢失。两档的差别就是「函数名」与「源码行号」，取前者。
#
# Windows（MSVC）的对应物是构建产物旁的 `.pdb`（构建脚本另存，不随分发包走）：
# `strip="debuginfo"` 在 PE 上是空操作，exe 本来就不内嵌 DWARF。
debug = "line-tables-only"
strip = "debuginfo"

# ASAN 插桩构建（`npm run build:core:asan` / `npm run package:asan`）：
# 继承 release 的优化与行号表（asan 报告要符号化），产物落 target/<triple>/asan/，
# 与 release 产物互不覆写；由构建脚本配 nightly 的 -Zsanitizer=address 编译。
#
# **asan 不继承 strip**：ASAN 报告要的是 `.debug_*`（它按 PC 查源码行号与变量所在
# 位置），删掉就只能报地址。这个 profile 不进分发包、也不走远端部署，体积不是约束。
[profile.asan]
inherits = "release"
strip = "none"
