[package]
name = "standalone-core"
version = "0.0.1"
edition = "2021"
description = "Standalone Core (out-of-process core implementation)"
license = "Apache-2.0"
# 构建脚本把 build-core.mjs 的构建指纹烧进编译期环境（docs/standalone-core.md 第 4.4 节）
build = "build.rs"

# 包名与二进制名保持中性的 `standalone-core`：对外可执行文件名由
# `src/config/project.json` 的 `core.binaryName` 决定，构建脚本按它落位，
# 产品名不出现在 Rust 侧。
[[bin]]
name = "standalone-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：帧内字段保持写入顺序，与 TypeScript 侧声明的字段顺序一致，
# 便于人眼比对帧内容与日志。
serde_json = { version = "1", features = ["preserve_order"] }
# 阻塞式 HTTP 客户端：查询在各自线程上跑，不需要异步运行时
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
sha2 = "0.10"
# Read 工具的 xlsx/xlsm 读取（对齐 Embedded 的 `xlsx` npm 包 + `readXlsxContent`）。
calamine = "0.36"
# ECMAScript `Number.prototype.toString()` 口径的浮点格式化：xlsx 单元格
# `String(cell)` 与 Embedded 逐字一致（Rust 默认格式化在指数阈值上不同）。
ryu-js = "1"
# 控制连接的 TCP keepalive 参数（`docs/core-remote.md` 第 2.5 节）：std 的
# keepalive 参数配置尚未稳定（`tcp_keepalive` feature），用 socket2 设置。
socket2 = "0.6"

[dev-dependencies]
# 单测里现造最小 xlsx（zip + inline string）作为 Read xlsx 路径的夹具
zip = "8"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 崩溃诊断：不 strip 并保留行号表——daemon / Core 异常退出时，panic 钩子强制捕获的
# 调用栈（写进 core-daemon 日志 / 宿主诊断日志）才能符号化出函数名与行号。
# 只带行号表不带变量信息，体积增量远小于完整 debug 信息；Windows（MSVC）的
# 行号表在构建产物旁的 .pdb 里，由 scripts/build-core.mjs 一并部署。
debug = "line-tables-only"

# ASAN 插桩构建（`npm run build:core:asan` / `npm run package:asan`）：
# 继承 release 的优化与行号表（asan 报告要符号化），产物落 target/<triple>/asan/，
# 与 release 产物互不覆写；由构建脚本配 nightly 的 -Zsanitizer=address 编译。
[profile.asan]
inherits = "release"
