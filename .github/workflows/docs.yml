# 文档一致性守卫 + 全量单测。docsLint 的输入不止 markdown——事件表对照
# AssistantEventBus 的类型联合，代码注释里的章节引用也参与校验，因此不做
# paths 过滤：只改 .ts / .rs 注释的 PR 同样要跑。tests job 把 check-types /
# lint / 单测（test:unit）/ Rust 测试搬进 CI：AGENTS.md 第 5 节工作流
# 靠它强制，不靠本地纪律；e2e 由 e2e.yml 的专用车道负责，不在这里重复。
name: docs

on:
  pull_request:

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- docs-lint

  tests:
    runs-on: ubuntu-latest
    steps:
      # resources/** 走 LFS（ripgrep 产物等）。不开 lfs: true 时 checkout 留下的
      # 是指针桩：build:core 复制到 Core 自带位的 rg 不是可执行文件，Grep / Glob
      # 用例（test_support.rs::bundled_ripgrep 有桩检测）会显式跳过
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl 目标的 ring（C / 汇编）与分配器 mimalloc 都需要 C 编译器（build-core.mjs 的
      # crossToolchainEnv 在 Linux 宿主上不注入 zig，直接用系统 cc）
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # 先产出 Linux Core 产物：standalone* 系列测试按宿主平台解析并驱动真实二进制，
      # 产物缺失会显式跳过（runner 汇总单列「跳过」）——CI 上必须真的跑
      - run: npm run build:core:linux-x64
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:core
