# 发布产物（GitHub Release）。手动触发：Actions → release → Run workflow。
#
# 为什么在 Windows runner 上构建全部产物
# --------------------------------------
# NSIS 安装包只能在 Windows 宿主产出；Linux 的 TUI 安装器是纯 Rust + musl 交叉
# （rust-lld 链接、C 部分由 zig 提供），Windows 宿主同样能建——判据是
# scripts/build-tui-installer.mjs 的 buildableOnHost（linux 目标任意宿主可建）。
# 所以一次 `npm run package` 就能出齐 .vsix / NSIS x64+arm64 / TUI 安装器四平台，
# 与开发者本地打包走同一条链，CI 不另发明打包步骤。
#
# 为什么不并进 all.yml / smoke.yml：发布要下载 electron 与全平台 Core 产物、跑完整
# `npm run package`（分钟级且吃网络），放进 PR 关键路径没有收益；它只在人为触发时跑。
#
# 版本号只从 package.json 取（workflow 可覆盖），tag 名由它派生：产物文件名里的
# ${version} 由 electron-builder / vsce 从 package.json 读取，两处必须是同一个值。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（semver，如 0.0.2）；留空取 package.json 的 version
        required: false
        default: ''
      draft:
        description: 先建草稿 Release（人工核对后再点发布）
        type: boolean
        default: true

# 同一时间只允许一个发布在跑：两个并发发布会在同名 Release 上互相覆盖资产
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 构建发布产物
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # resources/** 走 LFS（Core 自带的 ripgrep 产物）：不开 lfs 时检出留下的是
      # 指针桩，打进包的 Grep / Glob 拿到的不是可执行文件
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # vsce 打包后要跑 scripts/fix_vsix_permissions.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      # build:core 默认构建全部四个携带目标：win32 x64 是本机，其余三个交叉
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # Linux musl 的 ring（C / 汇编）与 mimalloc 要 C 编译器：build-core 用 zig cc 交叉
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: 定版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          input='${{ inputs.version }}'
          if [ -n "$input" ]; then
            # tag 名与产物文件名都由它派生，形状不对后面全是脏数据：直接报错
            if ! [[ "$input" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::version 必须是 semver（如 0.0.2），收到：$input"
              exit 1
            fi
            npm pkg set version="$input"
          fi
          version=$(node -p "require('./package.json').version")
          echo "版本：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # 一条链出齐：.vsix、NSIS x64/arm64（含 blockmap 与 latest.yml）、TUI 安装器四平台。
      # 打包前校验（verify-core-artifacts / verify-nsis-payload）已挂在链里，旧 Core 或
      # 丢文件的安装包都会在这一步失败
      - name: 打包
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            release/*.vsix
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/tui-installer/*
          retention-days: 7

  publish:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      # 发布走业界标准 action（API 直连），不手写 gh 脚本：本 job 不 checkout，工作目录
      # 没有 .git，gh 不带 -R 时靠 git remote 推断仓库，在这里必挂（曾导致发布失败）。
      # 旧脚本的语义逐条落进 action 输入：
      # - tag 已有 Release 时走更新、overwrite_files 默认覆盖同名资产（等价 --clobber），
      #   同一版本重跑幂等；正文按同一 tag 重新生成，内容不变
      # - target_commitish 把 tag 指到本次触发的提交，发布物与源码在同一个 commit 上
      # - 复用已有草稿时保持草稿态，不悄悄发布
      # - fail_on_unmatched_files 兜底「构建产物为空」：任一 glob 落空即失败；
      #   产物名含空格（<productName>-0.0.1-setup-x64.exe）由 glob 匹配，无 shell 分词问题
      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.vsix
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/tui-installer/*
