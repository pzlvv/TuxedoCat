# 冒烟车道（MR 合入闸门）。跑文档守卫 + 编译类检查 + 单测 + Rust 测试——e2e 之外的
# 全部测试，分钟级出结果。MR 必须两个 job 全绿才可合入：分支保护里把 docs-lint /
# tests 设为必填 check。
#
# docsLint 的输入不止 markdown——事件表对照 AssistantEventBus 的类型联合，代码注释
# 里的章节引用也参与校验，因此不做 paths 过滤：只改 .ts / .rs 注释的 PR 同样要跑。
#
# 本文件同时是可复用工作流（workflow_call）：all.yml 的整点全量回归直接调用它，
# 冒烟内容全仓库只有这一份定义。e2e 用例不在这里跑（归 all.yml 的整点车道），但
# check-types:e2e 是纯类型检查、不是跑 e2e：收进 tests job 保证 MR 上就拦下会让
# 定时车道在编译期变红的类型漂移。
name: smoke

on:
  pull_request:
  workflow_call:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- docs-lint

  tests:
    runs-on: ubuntu-latest
    steps:
      # resources/** 走 LFS（ripgrep 产物等）。不开 lfs: true 时 checkout 留下的
      # 是指针桩：build:core 复制到 Core 自带位的 rg 不是可执行文件，Grep / Glob
      # 用例（test_support.rs::bundled_ripgrep 有桩检测）会显式跳过
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl 目标的 ring（C / 汇编）与分配器 mimalloc 都需要 C 编译器（build-core.mjs 的
      # crossToolchainEnv 在 Linux 宿主上不注入 zig，直接用系统 cc）
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # 先产出 Linux Core 产物：standalone* 系列测试按宿主平台解析并驱动真实二进制，
      # 产物缺失会显式跳过（runner 汇总单列「跳过」）——CI 上必须真的跑
      - run: npm run build:core:linux-x64
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit
      # 偶发失败的后台线程 panic（如子代理槽位配对）需要完整回溯定位
      - run: npm run test:core
        env:
          RUST_BACKTRACE: 1
      - run: npm run check-types:e2e
