# 冒烟车道（MR 合入闸门）。跑文档守卫 + 编译类检查 + 单测 + Rust 测试——e2e 之外的
# 全部测试，分钟级出结果。MR 必须两个 job 全绿才可合入：分支保护里把 docs-lint /
# tests 设为必填 check。
#
# docsLint 的输入不止 markdown——事件表对照 AssistantEventBus 的类型联合，代码注释
# 里的章节引用也参与校验，因此不做 paths 过滤：只改 .ts / .rs 注释的 PR 同样要跑。
#
# 本文件同时是可复用工作流（workflow_call）：all.yml 的整点全量回归直接调用它，
# 冒烟内容全仓库只有这一份定义。e2e 用例不在这里跑（归 all.yml 的整点车道），但
# check-types:e2e 是纯类型检查、不是跑 e2e：收进 tests job 保证 MR 上就拦下会让
# 定时车道在编译期变红的类型漂移。
name: smoke

on:
  pull_request:
  workflow_call:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    # 每个 job 都要显式上限：不设时 GitHub 默认给 6 小时，一个挂死的步骤会一直占着
    # runner，MR 的合入闸门也跟着卡住。实测约 1 分钟；10 分钟没结论说明 npm ci 或
    # 用例本身挂住了。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 走 composite action 而不是裸 `npm ci`：setup-node 只缓存 ~/.npm（registry 压缩包），
      # 命中后仍要解包 + 链接 1152 个包（实测 53–65s）。这个 action 直接缓存 node_modules。
      - uses: ./.github/actions/npm-ci
      - run: npm run test:unit -- docs-lint

  tests:
    runs-on: ubuntu-latest
    # 上限 20 分钟：给 cargo 冷编译留余量，同时保证 MR 闸门即使挂住也不会占到小时级。
    # 关键路径是下面「轨道 B」——它包含 cargo test 的两份编译（cargo test 自己的
    # debug 构建 + mount-proxy），挪不走也缓存不了。
    timeout-minutes: 20
    steps:
      # resources/** 走 LFS（ripgrep 产物等）。不开 lfs: true 时 checkout 留下的
      # 是指针桩：build:core 复制到 Core 自带位的 rg 不是可执行文件，Grep / Glob
      # 用例（test_support.rs::bundled_ripgrep 有桩检测）会显式跳过
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl 目标的 ring（C / 汇编）与分配器 mimalloc 都需要 C 编译器（build-core.mjs 的
      # crossToolchainEnv 在 Linux 宿主上不注入 zig，直接用系统 cc）。
      # 走 composite action 而不是裸 apt-get：runner 的源解析会抖（`.github/actions/apt-install`）
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      # ---- 两条轨道并行 ----
      #
      # 为什么并行：`build:core:linux-x64`（release + LTO）与 `test:core`
      # （cargo test 自己再编一套 debug）是两份互不依赖的 cargo 产物，谁都读不到谁。
      # 串行跑等于把两份编译时间相加（CI 实测 103s + 333s，占本 job 的 74%）。
      #
      # 为什么不直接让 `build:core:linux-x64` 改 `--debug` 省掉 release 编译：
      # `--debug` 产出的 Core 带 `.debug_*` 段，会撞上 `corePlatformMatrix` 对**随包
      # 发布的 profile** 的断言（release 保留 `.symtab`、删 `.debug_*`，
      # docs/core/standalone-core.md 第 3.1 节）。那等于用「冒烟不再验证发布形态」
      # 换时间，不划算——这里改成并行而不是降级。
      #
      # 为什么轨道 B 单独给 `CARGO_TARGET_DIR`：两份 cargo 若共用同一 target 目录，
      # 它们会抢同一个 `.rustc_info.json` 与 `tmp/`（profile 锁虽不同，顶层文件仍是
      # 共享的）。分目录之后两边零共享，不存在互相踩的可能；放 /tmp 也让仓库工作树
      # 不因为多一个 target 目录而影响 docsLint / brandLiteral 这类全仓扫描用例。
      #
      # 为什么 `test:unit` 必须留在轨道 A：`standalone*` 系列直接驱动
      # `resources/core/<host>/` 下的真实产物，要等轨道 A 的 build:core 落位；
      # 产物缺失时它们走 markSkipped（runner 单列「跳过」，不算通过）。
      - name: 轨道 A：发布形态 Core + 全部单测
        run: |
          set -euo pipefail
          # 轨道 B 先起后台：它是关键路径（cargo test 的 debug 编译比 release 更慢）
          CARGO_TARGET_DIR=/tmp/cargo-test-target RUST_BACKTRACE=1 npm run test:core \
            > /tmp/track-b.log 2>&1 &
          trackB=$!
          npm run build:core:linux-x64
          npm run test:unit
          npm run check-types
          npm run lint
          # Rust 格式基线（AGENTS.md 第 5 节）：四个 crate 的 cargo fmt --check，
          # 工具链与上面那步 dtolnay/rust-toolchain@stable 同源，不会因版本漂移误报
          npm run fmt:rust:check
          npm run check-types:e2e
          # 收尾：轨迹 B 的结论与日志在最后统一给出，避免两条轨道的输出交错。
          # 判断放在 if 里（不靠 `set -e`）——要的是把日志打出来再失败，不是静默退出。
          # 成功时只摘 test result 行：完整日志 1200+ 行，全贴会把本 job 的日志淹掉；
          # 失败时才整段贴，那时顺序与上下文都是排障必需的。
          if wait "$trackB"; then
            grep -E "^(test result|     Running|   Doc-tests)" /tmp/track-b.log || true
          else
            echo "::group::轨道 B（cargo test）失败日志"
            cat /tmp/track-b.log
            echo "::endgroup::"
            exit 1
          fi
