# 一次性验证：runner 层的 .env 代理是否进入 job（含 Set up job 的 action 包下载）。
#
# 三个判据：https_proxy 是否在 step 里可见、回环是否被 no_proxy 排除、
# codeload 直连与代理的实际吞吐差多少。用完即删。
name: probe-runner-env

on:
  workflow_dispatch:

jobs:
  probe:
    name: probe-runner-env
    runs-on: [self-hosted, linux, x64, e2e-ssh]
    timeout-minutes: 5
    steps:
      - name: 代理变量是否可见
        run: |
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "no_proxy=${no_proxy:-<未设置>}"
      - name: 直连 vs 代理下载吞吐（8MB Core 同量级）
        run: |
          set -uo pipefail
          url="https://codeload.github.com/actions/download-artifact/tar.gz/d3f86a106a0bac45b974a628896c90dbdf5c8093"
          echo "--- 直连（显式清掉代理）"
          env -u https_proxy -u http_proxy curl -s -o /dev/null -w "%{speed_download} B/s %{time_total}s %{size_download}B\n" --max-time 40 "$url" || echo "直连超时"
          echo "--- 走 .env 里的代理"
          curl -s -o /dev/null -w "%{speed_download} B/s %{time_total}s %{size_download}B\n" --max-time 40 "$url" || echo "代理超时"
      - name: 回环是否被 no_proxy 排除（ssh 用例的前提）
        run: |
          set -uo pipefail
          # 本机 sshd 在 22；若回环被代理接管，这一步会失败或走到代理
          timeout 15 bash -c 'exec 3<>/dev/tcp/127.0.0.1/22; head -c 40 <&3' && echo "回环直连 OK" || echo "回环被拦"
