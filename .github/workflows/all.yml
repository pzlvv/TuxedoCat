# 全量回归车道：冒烟（复用 smoke.yml）+ e2e 四车道，合入 main 后整点定时执行，
# 是 PR 冒烟闸门之外的全量回归网；workflow_dispatch 供手动补跑。
#
# 不挂 pull_request：MR 的合入闸门是 smoke.yml（分钟级出结果），全量要构建全部产物
# 并在 xvfb 里跑真实 Electron 链路，放不进 PR 关键路径——合入后的回归由定时车道兜底。
#
# **整条车道 30 分钟必出结论**：关键路径 =
# `prepare` + max(并行 e2e 车道的墙钟)。当前编排 = 8 + 18 = 26 分钟，留 4 分钟给排队与
# 收尾；`src/test/e2eCiLane.test.ts` 对这两个上限与总预算做断言。
# 三道时间闸门同时生效——
#   1. 单用例：分档硬上限（快车道 30s / 整应用 60s / 真实 SSH 60s，见
#      `e2e/playwright.config.ts`），超时即「Test timeout」，不是断言失败；
#   2. 单车道：Playwright 的 `globalTimeout`（CI 15 分钟）连同未开始的用例一起收尾；
#   3. 失败早停：5 条失败即停（`maxFailures`），不做重试（`retries: 0`）。
#
# **墙钟的两条来源与各自的压法**（`e2e/README.md` 的「时间预算」一节）：
# - `ssh` 车道受**自托管 runner 数量**约束：标签 `e2e-ssh` 下只有一台机器，四个 spec
#   job 实际串行排队（run 45177031308 合计 25m47s），**它是整条 `all` 的关键路径**。
#   编排保持四路并行声明——补第二台机器即真并行；单机上能压的是各 job 的固定开销
#   （已压：后三个 job 复用第一个 job 的分片下载结果）。
# - `electron` 车道 123 条用例在同一 runner 里串行跑 12.8 分钟，按 `--shard=i/4` 切四片
#   能把这条车道压到约 4 分钟，但**改不动整条 `all` 的墙钟**（ssh 串行才是瓶颈），
#   因此当前不切；等 ssh 能真并行后再切，省的是同时占用的 runner 数。
#
# electron-ssh（真实 SSH 远端）挂 GitHub 托管 runner：runner 只当**宿主**（跑 Electron +
# mock LLM），SSH 远端是 `e2e/environments.json` 里那台真实 Linux 机器。选托管 runner 而不是
# 在那台机器上跑自托管 runner：远端是 4 vCPU 共享云主机（单核 sha256 比 runner 慢一个数量级），
# 且 SSH 用例的瓶颈在 WAN 往返与远端 Core 部署，不在宿主编译；宿主侧产物由 prepare 构建一次
# 分发到各车道。环境文件含口令、不入库，由 secrets 在 job 内现写
# （`scripts/write-e2e-environments.mjs`，缺 secret 直接报错）。
#
# pycharm-plugin（specs/035 的 PyCharm 插件宿主）仍是本地车道：需要本机 PyCharm
# （e2e/environments.json 的 pycharm 段）与 npm run package:pycharm 产物，托管 runner 两者皆无
# （npm run test:e2e:pycharm）。接回 CI 时先在 e2e/README.md 的 CI 车道表里补回对应 job。
name: all

on:
  schedule:
    - cron: '0 * * * *' # 每小时整点
  workflow_dispatch:

concurrency:
  group: all-${{ github.ref }}
  # 定时车道不取消在跑实例：上一轮超时就在下一轮排队等，回归结果不被新触发冲掉
  cancel-in-progress: false

jobs:
  # 冒烟内容只有一份定义：直接复用 smoke.yml（PR 闸门跑的就是这几个 job）
  smoke:
    uses: ./.github/workflows/smoke.yml

  prepare:
    name: 构建 e2e 产物
    runs-on: ubuntu-latest
    # 实测 3–5 分钟（cargo 增量缓存命中时更短）。上限 8 分钟：构建类步骤挂住
    # （apt 源抖动 / cargo 索引）应在这一步就断，而不是把下面四个车道一起拖住。
    timeout-minutes: 8
    steps:
      # resources/** 走 LFS（Core 自带的 ripgrep 产物）：不开 lfs 时 checkout 留下的是
      # 指针桩，Grep / Glob 与远端部署拿到的不是可执行文件
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node_modules 缓存（同冒烟 tests job）：`prepare` 是整条 `all` 的起点，它前面
      # 多花的每一分钟都会原样加到每一个下游车道。npm ci 实测 65s（run 45177031308 的
      # 12:43:49 → 12:44:54），命中缓存后只剩解压 + 建链。
      - uses: ./.github/actions/npm-ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl 目标的 ring（C / 汇编）与分配器 mimalloc 需要 C 编译器；
      # 源解析抖动由 composite action 退避重试（`.github/actions/apt-install`）
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      # Rust 编译缓存（与 smoke.yml 的 tests job 同一口径）：release 构建的依赖产物
      # 跨 checkout 复用，每次只重编 standalone-core 自己。必须在 rust-toolchain 之后
      # ——缓存键含 rustc 版本。`shared-key: prepare` 与 smoke 的键区分开：两边缓存内容
      # 一致（都是 x64-linux release），但用不同键能让 eviction 与命中互不影响。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core-rs -> target
            mount-proxy-rs -> target
          shared-key: prepare
          cache-on-failure: true
      # playwright.config.ts 在配置加载期校验 Core 产物（Linux 宿主必查），先建
      - run: npm run build:core:linux-x64
      - run: npm run build:webview
      - run: npm run copy-assets
      - run: npm run build:electron
      # e2e 源码的类型检查在 smoke.yml 的 tests job，PR 闸门与这里共用同一步
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            dist
            dist-electron
            resources/core
          retention-days: 1

  ui:
    name: e2e-ui（webview / 远端目录选择器 / 终端页面）
    needs: prepare
    runs-on: ubuntu-latest
    # 实测整轮 4 分钟。上限与另外三个车道同为 18 分钟：**必须高于 Playwright 的整轮
    # 上限（15min）**，否则某条用例挂住时是 job 先被杀、只留一句「job 超时」，
    # 拿不到 Playwright 报的那条用例名。正常情况下这条车道 4 分钟就结束，不吃这个上限。
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node_modules 缓存（同 prepare / electron 车道）
      - uses: ./.github/actions/npm-ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.ts --project=webview-ui --project=remote-workspace-ui --project=terminal-ui
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ui-trace
          path: test-results
          retention-days: 3

  electron:
    name: e2e-electron（整应用）
    needs: prepare
    runs-on: ubuntu-latest
    # 实测 123 条用例约 13 分钟，加准备（npm ci + chmod + apt + install-deps）约 2.5 分钟
    # ≈ 15.5 分钟。上限 18 分钟 = 实测 × 1.16，同时满足 `prepare(8) + 18 = 26 ≤ 30`。
    # 超了就是「用例太多 / 某条挂住」，job 直接红，不占着 runner 等 GitHub 的默认值。
    #
    # 为什么不按 `--shard` 切四片：切了也只是把这条车道从 15.5 分钟压到 4 分钟，而整条
    # `all` 的墙钟由 ssh 车道的**串行排队**决定（见 `ssh` 的注释），四片只是多占三台
    # runner 而不提前一分钟出结论。等 ssh 能真并行后再按这里的分片注释切。
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node_modules 缓存：准备期实测 1.2 分钟（setup-node 只缓存 ~/.npm，命中后仍要
      # 解包 1152 个包）
      - uses: ./.github/actions/npm-ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      # artifact 上传不保留文件权限（actions/upload-artifact 的 Limitations：zip 后所有
      # 文件落成 644）：Core 与自带 ripgrep 是 spawn 出来的可执行文件，不补回 +x 宿主
      # spawn 直接 EACCES，core 起不来、凡过 core 的用例全部超时
      - run: chmod -R u+x dist/resources/core resources/core
      # Electron 需要 X 显示与 Chromium 的运行时库：xvfb 提供前者，
      # install-deps 提供后者（Ubuntu 24.04 的 t64 包名由 Playwright 自己处理）；
      # openbox 补窗口管理器——最大化 / 焦点语义（US-31 等）在只有显示没有 WM 的裸 X 里不成立。
      # 源解析抖动由 composite action 退避重试（`.github/actions/apt-install`）
      - uses: ./.github/actions/apt-install
        with:
          packages: xvfb openbox
      - run: npx playwright install-deps chromium
      # Electron 二进制由 npm 包按需现下（`node_modules/electron` 没有 postinstall，
      # 第一次 `require('electron')` 才同步 spawn install.js 拉 ~100MB）。不预热时它
      # 会落在**第一条用例**的墙钟里：实测 20–40s，单用例上限 60s 的那条因此直接超时。
      # 预热把这段挪进 job 准备期（幂等，已就位时 3ms）。
      - run: node scripts/warm-electron.cjs
      - run: xvfb-run -a bash -c "openbox >/dev/null 2>&1 & exec npx playwright test -c e2e/playwright.config.ts --project=electron-app"
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-electron-trace
          path: test-results
          retention-days: 3

  tui:
    name: e2e-tui（安装程序）
    needs: prepare
    runs-on: ubuntu-latest
    # 实测约 2.5 分钟（用例内 cargo 构建安装器）。上限同另外三个车道 18 分钟
    # （高于 Playwright 整轮上限，理由见 `ui` 的注释）。
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      # 安装器在用例内用 cargo 构建（tui-rs + installer-rs 的 musl 产物）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # 源解析抖动由 composite action 退避重试（`.github/actions/apt-install`）
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - run: npm run test:e2e:tui
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-tui-trace
          path: test-results
          retention-days: 3

  ssh:
    name: e2e-ssh（${{ matrix.spec }}）
    needs: prepare
    # 本车道跑在**自托管的 Ubuntu 测试机**上，而不是 GitHub 托管 runner：SSH 远端就是
    # 这台机器自己的 localhost（`e2e/environments.json` 由 secrets 现写成 127.0.0.1）。
    #
    # 为什么搬：托管 runner 到远端只有 0.01–0.02MB/s 上行（实测见
    # `scripts/diag-upload.mjs` 的 run 45017484821：8MB 产物 180s 只走到 2.3MB），
    # 每次冷部署把 Core 传过去要 6 分钟以上，直接撞穿 60s 单用例上限——`remoteSshExecution`
    # 的五条用例在 run 45007017025 里全部「Test timeout of 60000ms exceeded」。
    # 跑在远端本机时这条链路是回环，同一个上传实测 5.8MB/s（本机 Windows 同口径 5–6MB/s）。
    #
    # 代价与前提：这台机器的 GitHub 下载要靠本机代理（直连 actions CDN 只有 0.03MB/s），
    # 部署口径见 e2e/README.md 的「自托管 runner」一节；它下线时本车道整条待机。
    runs-on: [self-hosted, linux, x64, e2e-ssh]
    # 单个 spec 文件的墙钟 = 准备（npm ci ~1min + 并行取产物 + 写环境文件 + apt ~30s +
    # install-deps ~10s）约 3min + 用例本身。实测最长的是
    # `remoteTaskSurvival`：11.2 分钟（含 180s sleep 的三条长任务用例）。
    # 上限 18 分钟 = 实测最长 × 1.6，同时满足 `prepare(8) + 18 = 26 ≤ 30` 的总预算。
    # 超过它说明用例挂住了，杀掉比等下去更有价值。
    timeout-minutes: 18
    # 四个 spec **并行**跑（每个 job 一份独立产物、一条独立远端工作区目录）：
    # 串行的墙钟是四个文件之和（43 分钟），30 分钟总预算装不下；并行后等于最慢那一个
    # （约 12 分钟）。
    #
    # 并行压的是**远端 sshd 的并发连接数**，判据是「每个 job 自己建多少条链」而不是
    # 「几个 job」。旧形态是四个文件塞进一个 job 串行跑 43 条用例、脚手架每执行一条
    # 命令建一次链（四个文件共 122 处调用），实测把连接数推到 39 条，撞上 sshd 的
    # `MaxStartups`（默认 10:30:100）后大面积 `Connection lost before handshake`。
    # 拆成每 job 一个文件后，单个文件的连接形态已被验证可用（run 44962124641 四个
    # job 全绿）。若四路并行仍出现上述握手失败，把 `max-parallel` 降到 2 即可
    # （墙钟翻倍到约 24 分钟，仍在 30 分钟预算内）——不要退回串行。
    #
    # `fail-fast: false`：四个文件跑的是不同的产品面，一个红了不该让另外三个被取消
    # （它们的结论对定位「是不是同一条链路的共同故障」是必要信息）。
    #
    # **症状与排队的关系**：自托管标签目前只有一台机器（`ubuntu-e2e`）注册，它一次只
    # 接一个 job——这个矩阵的四路并行在容量上退化成串行排队（实测 run 45030636920：
    # 四个 job 依次 14:08 → 14:26 → 14:44 → 15:03 启动，每段都撞 18 分钟上限）。
    # 编排仍保留并行：补第二台同标签机器后无需改 workflow 即可真正并起来。
    #
    # **这条车道是整条 `all` 的关键路径**（run 45177031308：四个 job 串行共 25m47s，
    # 而 electron 车道 14m44s、prepare 3m58s）。在只有一台机器的前提下能压的只有每个
    # job 的固定开销，两处已压：分片下载（见 RT-15）与后三个 job 复用第一个 job 的
    # 本地产物缓存（`ARTIFACT_CACHE_DIR`，省三份 22.7–149.5s 的重复下载）。
    # 要真正把整条车道压进 12 分钟，得补同标签机器让四路真并行——那时各 spec 的
    # uid 级清场（`pkill -u "$(id -u)"`）会互杀对方的 Core，需要先改成按 job 隔离的
    # 清场口径；这件事不在本 workflow 里能解决，见 `e2e/README.md` 的「CI 车道」。
    strategy:
      fail-fast: false
      matrix:
        spec:
          - electron/remoteSshExecution.spec.ts
          - electron/remoteTaskSurvival.spec.ts
          - electron/remoteChangeList.spec.ts
          - electron/overlayMountProxyRemote.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 自托管机器直连 actions CDN 只有 0.03MB/s（实测），经本机 mihomo 代理后 3.5MB/s。
      # 代理**只注入到需要出网的步骤**，不设 job 级：用例进程要连的是远端回环上的
      # mock LLM 与 sshd，全局代理会把它们一起绕进代理（回环连接会被代理反转成外网）。
      #
      # 这一步**不走 `./.github/actions/npm-ci`**（其余三个车道走）：那个 composite 用
      # `actions/cache` 恢复 node_modules，而恢复要经 actions CDN——本机链路 0.03MB/s，
      # 拉一份 150–300MB 的缓存比现装 17–19s 慢得多。保持现装。
      - run: npm ci
        env:
          https_proxy: http://127.0.0.1:7890
          http_proxy: http://127.0.0.1:7890
      # **不能用 actions/download-artifact**：它用单条连接拉 blob，而本机到
      # `*.blob.core.windows.net` 的单连接吞吐只有 ~25KB/s（实测 25–31KB/s；banana 代理
      # 各节点 4–35KB/s，加代理更差）。30MB 的 e2e-artifacts 要 20 分钟，四个 job
      # 全撞 18 分钟上限红在下载这一步，产物目录根本没落出来（run 45027408803 /
      # 45030636920 的 `chmod: cannot access 'dist/resources/core'` 即此）。
      # 瓶颈在单连接而非线路：同一份 blob 切成 32 段并发取，聚合实测 363KB/s（1/4/8/
      # 16/32 路 = 25/102/204/181/363KB/s），30MB 约 1.5 分钟。
      # 换成 `scripts/download-artifact-parallel.mjs` 后落盘布局与官方 action 一致。
      #
      # `ARTIFACT_CACHE_DIR` 让**同 run 的后三个 job 直接复用**第一个 job 下好的产物：
      # 标签下只有一台机器，四个 job 串行排队在同一台机器上，每个都重下一份一模一样的
      # 28.8MB 是纯浪费（run `45177031308` 实测 77.1s / 149.5s / 22.7s / 66.0s）。
      # 缓存键含 run id + attempt：换 run 或重跑不会拿到上一轮的产物；复用前脚本会
      # 校验三个必备目录齐全，被中断的半份不会被当成可用。
      #
      # 落在 `runner.workspace`（`_work/<repo>` 的上一级，仓库目录之外）而不是
      # `runner.temp`：后者每个 job 开头会被清理，跨 job 缓存会被删掉。
      #
      # 解压暂存目录建在缓存目录**之内**（`<cache>/.staging/job-*`），不许是 `/tmp`：
      # 落缓存要靠 `rename`，而 `rename` 只在同一文件系统内成立——runner 的 `/tmp` 与
      # 工作区分属两个挂载点，跨过去必报
      # `EXDEV: cross-device link not permitted`（run `45292363880`：四个 ssh job 全红
      # 在取产物这一步，用例一条都没跑）。
      - name: 并行取 e2e 产物
        run: node scripts/download-artifact-parallel.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: e2e-artifacts
          ARTIFACT_DEST: .
          ARTIFACT_CACHE_DIR: ${{ runner.workspace }}/.e2e-artifacts-cache
      # 同 electron 车道：artifact 上传把文件落成 644，Core 与自带 ripgrep 要 spawn，
      # 不补回 +x 就是 EACCES（已知坑 6）
      - run: chmod -R u+x dist/resources/core resources/core
      # 环境文件含 SSH 口令、不入库：由 secrets 现写（缺项直接报错，不回退、不跳过）。
      # 口令经 env 传入而不是拼进 run 的命令行——拼进命令行会出现在日志的 `Run` 段
      - name: 写 e2e/environments.json
        env:
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
          E2E_SSH_PASSWORD: ${{ secrets.E2E_SSH_PASSWORD }}
          E2E_SSH_SUDO_USER: ${{ secrets.E2E_SSH_SUDO_USER }}
          E2E_SSH_SUDO_PASSWORD: ${{ secrets.E2E_SSH_SUDO_PASSWORD }}
          E2E_SSH_LLM_ADVERTISE_HOST: ${{ secrets.E2E_SSH_LLM_ADVERTISE_HOST }}
        run: node scripts/write-e2e-environments.mjs
      # 机器上已装（这份清单只保证「装过」；重复安装时 apt 直接跳过）
      - uses: ./.github/actions/apt-install
        with:
          packages: xvfb openbox
      - run: npx playwright install-deps chromium
        env:
          https_proxy: http://127.0.0.1:7890
          http_proxy: http://127.0.0.1:7890
      # 与 electron 车道同一个理由预热 Electron 二进制：`node_modules/electron` 没有
      # postinstall，第一次 `require('electron')` 才现下 ~100MB（自托管机器上这一步走
      # Electron 的 release CDN，同样要代理）。落在用例里就是前几条用例各烧掉 20–40s
      # 墙钟、撞上 60s 单用例上限后整条车道被失败早停掐掉（run `44998731954` 实证）。
      - run: node scripts/warm-electron.cjs
        env:
          https_proxy: http://127.0.0.1:7890
          http_proxy: http://127.0.0.1:7890
      # Electron 起点同 electron 车道：Linux 无显示要 xvfb，裸 X 没有 WM（最大化 / 焦点
      # 语义不成立）要 openbox。SSH 远端由用例自己经 ssh2 建链，不依赖本节点的 ssh 客户端
      #
      # `TUXEDO_CAT_E2E_CONNECT_PROBE_MS`：放宽建链探测超时（产品默认 3 秒，规格见
      # `docs/core/client-connection.md`）。共享 CI runner 跨公网连远端时 SSH 建链会超过
      # 3 秒，`remoteSshExecution` 的重连两条因此恒红（实测 `reconnect failed:
      # 远程连接超时（3 秒）`）。这个开关只影响测试进程内的等待上限，产品默认值不变。
      - run: xvfb-run -a bash -c "openbox >/dev/null 2>&1 & exec npx playwright test -c e2e/playwright.config.ts --project=electron-ssh ${{ matrix.spec }}"
        env:
          TUXEDO_CAT_E2E_CONNECT_PROBE_MS: '20000'
      # 凭证闸门：trace 会记录 fill() 进密码框的明文（动作参数 / 日志 / DOM 快照三处），
      # 而仓库是 public——上传前扫一遍，命中即让 job 失败，绝不把口令带出 runner。
      # 项目配置已对 electron-ssh 关掉 trace（e2e/playwright.config.ts），这是第二道。
      # `if: always()`：用例失败也要先扫；成功时目录为空、脚本直接放行
      - name: 扫描 test-results 是否含凭证明文
        if: always()
        env:
          E2E_SSH_PASSWORD: ${{ secrets.E2E_SSH_PASSWORD }}
          E2E_SSH_SUDO_PASSWORD: ${{ secrets.E2E_SSH_SUDO_PASSWORD }}
        run: node scripts/scan-e2e-artifacts-for-secrets.mjs test-results
      # ssh 车道**不**上传 trace（其它车道的 trace 里没有凭证）：这条车道已关 trace，
      # 上传空目录无意义；真要排查用 E2E_DEBUG=1 重跑，不靠 artifact 带口令出去。
      # 失败现场改为只保留 Playwright 的文本输出（已在上一步的日志里，不含口令）
