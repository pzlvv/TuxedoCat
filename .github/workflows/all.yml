# 全量回归车道：冒烟（复用 smoke.yml）+ e2e 三车道，合入 main 后整点定时执行，
# 是 PR 冒烟闸门之外的全量回归网；workflow_dispatch 供手动补跑。
#
# 不挂 pull_request：MR 的合入闸门是 smoke.yml（分钟级出结果），全量要构建全部产物
# 并在 xvfb 里跑真实 Electron 链路，放不进 PR 关键路径——合入后的回归由定时车道兜底。
#
# electron-ssh（真实 SSH 远端）不进 CI：它需要一台可连的外部机器，runner 内的 sshd 与
# 真实远端差异太大（SSH 服务配置 / 网络 / 权限模型），按现状判定为本地车道
# （npm run test:e2e:ssh，需要 e2e/environments.json）。接回 CI 前先在
# e2e/README.md 的 CI 车道表里补回对应 job。
#
# pycharm-plugin（specs/035 的 PyCharm 插件宿主）同为本地车道：需要本机 PyCharm
# （e2e/environments.json 的 pycharm 段）与 npm run package:pycharm 产物，runner 两者皆无
# （npm run test:e2e:pycharm）。接回 CI 前先在 e2e/README.md 的 CI 车道表里补回对应 job。
name: all

on:
  schedule:
    - cron: '0 * * * *' # 每小时整点
  workflow_dispatch:

concurrency:
  group: all-${{ github.ref }}
  # 定时车道不取消在跑实例：上一轮超时就在下一轮排队等，回归结果不被新触发冲掉
  cancel-in-progress: false

jobs:
  # 冒烟内容只有一份定义：直接复用 smoke.yml（PR 闸门跑的就是这几个 job）
  smoke:
    uses: ./.github/workflows/smoke.yml

  prepare:
    name: 构建 e2e 产物
    runs-on: ubuntu-latest
    steps:
      # resources/** 走 LFS（Core 自带的 ripgrep 产物）：不开 lfs 时 checkout 留下的是
      # 指针桩，Grep / Glob 与远端部署拿到的不是可执行文件
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl 目标的 ring（C / 汇编）与分配器 mimalloc 需要 C 编译器
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # playwright.config.ts 在配置加载期校验 Core 产物（Linux 宿主必查），先建
      - run: npm run build:core:linux-x64
      - run: npm run build:webview
      - run: npm run copy-assets
      - run: npm run build:electron
      # e2e 源码的类型检查在 smoke.yml 的 tests job，PR 闸门与这里共用同一步
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            dist
            dist-electron
            resources/core
          retention-days: 1

  ui:
    name: e2e-ui（webview / 远端目录选择器 / 终端页面）
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.ts --project=webview-ui --project=remote-workspace-ui --project=terminal-ui
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ui-trace
          path: test-results
          retention-days: 3

  electron:
    name: e2e-electron（整应用）
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      # artifact 上传不保留文件权限（actions/upload-artifact 的 Limitations：zip 后所有
      # 文件落成 644）：Core 与自带 ripgrep 是 spawn 出来的可执行文件，不补回 +x 宿主
      # spawn 直接 EACCES，core 起不来、凡过 core 的用例全部超时
      - run: chmod -R u+x dist/resources/core resources/core
      # Electron 需要 X 显示与 Chromium 的运行时库：xvfb 提供前者，
      # install-deps 提供后者（Ubuntu 24.04 的 t64 包名由 Playwright 自己处理）；
      # openbox 补窗口管理器——最大化 / 焦点语义（US-31 等）在只有显示没有 WM 的裸 X 里不成立
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - run: npx playwright install-deps chromium
      - run: xvfb-run -a bash -c "openbox >/dev/null 2>&1 & exec npx playwright test -c e2e/playwright.config.ts --project=electron-app"
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-electron-trace
          path: test-results
          retention-days: 3

  tui:
    name: e2e-tui（安装程序）
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
      # 安装器在用例内用 cargo 构建（tui-rs + installer-rs 的 musl 产物）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm run test:e2e:tui
      # 失败时保留 Playwright trace（npx playwright show-trace <zip>）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-tui-trace
          path: test-results
          retention-days: 3
